server:
  port: 0

spring:
  application:
    name: appointment-service-test
  datasource:
    url: jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.H2Dialect
    open-in-view: false
  redis:
    host: localhost
    port: 6379

eureka:
  client:
    enabled: false

logging:
  level:
    com.microcare.appointment: DEBUG
    org.redisson: WARN
