server:
  port: 8080

spring:
  application:
    name: api-gateway
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/microcare_auth?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:deepak123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cloud:
    gateway:
      # CORS for the frontend (nginx same-origin in Docker; Vite dev server in local dev).
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
              - "http://localhost:3000"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      # Explicit routes only — the discovery locator is disabled so that
      # every proxied request flows through the JWT/auth filters below.
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${RATE_LIMIT_REPLENISH_RATE:20}
            redis-rate-limiter.burstCapacity: ${RATE_LIMIT_BURST_CAPACITY:40}
            key-resolver: "#{@clientIpKeyResolver}"
      routes:
        - id: patient-service
          uri: lb://patient-service
          predicates:
            - Path=/api/patients/**
        - id: appointment-service
          uri: lb://appointment-service
          predicates:
            - Path=/api/appointments/**
        - id: billing-service
          uri: lb://billing-service
          predicates:
            - Path=/api/invoices/**

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,gateway
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.microcare.gateway: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n"

# =====================
# Custom Application Config
# =====================
app:
  jwt:
    # HMAC secret — MUST be at least 256 bits (32+ chars) and overridden in production.
    secret: ${JWT_SECRET:microcare-dev-secret-key-change-me-in-production-0123456789}
    # Token lifetime in milliseconds (default: 24 hours)
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  patient-service:
    # Base URL used by POST /auth/register to validate that a patient record exists.
    # Uses Eureka load balancing in production via the discovery-aware WebClient builder.
    base-url: ${PATIENT_SERVICE_URL:http://patient-service:8081}
