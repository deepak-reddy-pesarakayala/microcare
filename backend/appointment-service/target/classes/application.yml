server:
  port: 8082

spring:
  application:
    name: appointment-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/microcare_appointments?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:deepak123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  # Redisson starter also reads the legacy spring.redis.* keys — keep both in sync.
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:microcare}
    password: ${RABBITMQ_PASSWORD:microcare_pass}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        prefetch: 1

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.microcare.appointment: DEBUG
    org.redisson: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n"

# =====================
# Custom Application Config
# =====================
app:
  rabbitmq:
    exchange: appointment.exchange
    dlx: appointment.dlx
    queue:
      billing-invoice: billing.invoice.queue
    dlq:
      billing-invoice: billing.invoice.dlq
    routing-key:
      appointment-confirmed: appointment.confirmed
    max-retries: 3
  outbox:
    poller:
      fixed-delay-ms: 5000
  slot-seeding:
    # Seeds a rolling window of AVAILABLE slots on startup so patients can
    # always book. Idempotent: existing (doctor, date, start time) slots are
    # never duplicated. doctor-ids = the doctor ids to seed (defaults to the
    # seeded demo doctors: Dr. Sarah Chen=100, Dr. Olivia Bennett=3).
    enabled: ${SLOT_SEED_ENABLED:true}
    doctor-ids: ${SLOT_SEED_DOCTOR_IDS:100,3}
    days-ahead: ${SLOT_SEED_DAYS_AHEAD:7}
    start-hour: ${SLOT_SEED_START_HOUR:9}
    end-hour: ${SLOT_SEED_END_HOUR:17}
    slot-minutes: ${SLOT_SEED_SLOT_MINUTES:60}
