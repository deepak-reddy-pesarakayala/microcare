server:
  port: 8083

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/microcare_billing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:deepak123}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  rabbitmq:
    host: ${RABBITMQ_HOST:localhost}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:microcare}
    password: ${RABBITMQ_PASSWORD:microcare_pass}
    virtual-host: ${RABBITMQ_VHOST:/}
    listener:
      simple:
        prefetch: 1

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:8761}/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.microcare.billing: DEBUG
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] [%X{correlationId:-}] %logger{36} - %msg%n"

# =====================
# Custom Application Config
# =====================
app:
  rabbitmq:
    exchange: appointment.exchange
    dlx: appointment.dlx
    queue:
      billing-invoice: billing.invoice.queue
    dlq:
      billing-invoice: billing.invoice.dlq
    routing-key:
      appointment-confirmed: appointment.confirmed
    max-retries: 3
