server:
  port: 8083

spring:
  application:
    name: billing-service
  datasource:
    url: jdbc:mysql://localhost:3306/microcare_billing?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: root
    password: rootpassword
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  rabbitmq:
    host: localhost
    port: 5672
    username: microcare
    password: microcare_pass
    virtual-host: /
    listener:
      simple:
        prefetch: 1

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: always

logging:
  level:
    com.microcare.billing: DEBUG

# =====================
# Custom Application Config
# =====================
app:
  rabbitmq:
    exchange: appointment.exchange
    dlx: appointment.dlx
    queue:
      billing-invoice: billing.invoice.queue
    dlq:
      billing-invoice: billing.invoice.dlq
    routing-key:
      appointment-confirmed: appointment.confirmed
    max-retries: 3
