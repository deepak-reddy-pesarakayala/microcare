name: microcare

services:

  # =====================
  # Infrastructure
  # =====================

  mysql:
    image: mysql:8.0
    container_name: microcare-mysql
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: microcare_patients
      MYSQL_USER: microcare_user
      MYSQL_PASSWORD: microcare_pass
    volumes:
      - mysql-data:/var/lib/mysql
      - ./init-scripts:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-prootpassword"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - microcare-network

  redis:
    image: redis:7-alpine
    container_name: microcare-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - microcare-network

  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: microcare-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: microcare
      RABBITMQ_DEFAULT_PASS: microcare_pass
      RABBITMQ_DEFAULT_VHOST: /
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    networks:
      - microcare-network

  # =====================
  # Platform services
  # =====================

  discovery-service:
    build: ./discovery-service
    container_name: microcare-discovery
    restart: unless-stopped
    ports:
      - "8761:8761"
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8761"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - microcare-network

  api-gateway:
    build: ./api-gateway
    container_name: microcare-api-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: rootpassword
      REDIS_HOST: redis
      EUREKA_HOST: discovery-service
      JWT_SECRET: ${JWT_SECRET:-microcare-dev-secret-key-change-me-in-production-0123456789}
      PATIENT_SERVICE_URL: http://patient-service:8081
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microcare-network

  patient-service:
    build: ./patient-service
    container_name: microcare-patient-service
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: rootpassword
      EUREKA_HOST: discovery-service
    depends_on:
      mysql:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8081"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microcare-network

  appointment-service:
    build: ./appointment-service
    container_name: microcare-appointment-service
    restart: unless-stopped
    ports:
      - "8082:8082"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: rootpassword
      REDIS_HOST: redis
      RABBITMQ_HOST: rabbitmq
      EUREKA_HOST: discovery-service
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8082"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microcare-network

  billing-service:
    build: ./billing-service
    container_name: microcare-billing-service
    restart: unless-stopped
    ports:
      - "8083:8083"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: rootpassword
      RABBITMQ_HOST: rabbitmq
      EUREKA_HOST: discovery-service
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8083"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microcare-network

  notification-service:
    build: ./notification-service
    container_name: microcare-notification-service
    restart: unless-stopped
    ports:
      - "8084:8084"
    environment:
      MYSQL_HOST: mysql
      MYSQL_USERNAME: root
      MYSQL_PASSWORD: rootpassword
      RABBITMQ_HOST: rabbitmq
      EUREKA_HOST: discovery-service
    depends_on:
      mysql:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8084"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s
    networks:
      - microcare-network

volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local
  rabbitmq-data:
    driver: local

networks:
  microcare-network:
    driver: bridge
